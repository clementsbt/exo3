<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Description de la page" />
    <title>Titre de la page</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />
    <!-- <script defer src="app.js"></script> -->
  </head>

  <body>
    <header>
      <nav aria-label="Navigation principale">
        <a href="/" aria-current="page">Accueil</a>
        <a href="/about.html">À propos</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>

    <main id="main">
      <h1>Bonjour 👋</h1>
      <p>Contenu principal ici.</p>

      <h2>Base 64 :</h2>
      <div id="base64Container">
        <button id="b64ConvertBtn" onclick="base64Convert()">Convertir le texte en base 64</button>
        <input type="text" placeholder="Entrez votre texte ici" id="base64Input" />
      </div>
    </main>

    <footer>
      <small>
        &copy;
        <span id="year"></span>
        Mon site
      </small>
    </footer>

    <script>
      // Petit bonus: année automatique
      document.getElementById("year").textContent = new Date().getFullYear();

      // Convertion en base 64

      const base64Input = document.getElementById("base64Input");

      function base64Convert() {
        const value = base64Input.value;
        const encodedValue = window.btoa(value);
        base64Input.value = encodedValue;
      }
    </script>
  </body>
</html>
