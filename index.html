<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />

  <body>
    <header>
      <nav aria-label="Navigation principale">
        <a href="/" aria-current="page">Accueil</a>
        <a href="/about.html">À propos</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>

    <main id="main">
      <h1>Bonjour 👋</h1>
      <p>Contenu principal ici.</p>

      <h2>Base 64 :</h2>
      <div id="base64Container">
        <button id="b64ConvertBtn" onclick="base64Convert()">Convertir le texte en base 64</button>
        <input type="text" placeholder="Entrez votre texte ici" id="base64Input" />
      </div>
        
      <input id="saisieBin" type="text" placeholder="Texte à convertir en binaire"><br>
      <button onclick="convertirBin()">Convertir</button>
      <p id="outputBin"></p>


      <input placeholder="Montant d'argent:" id = "amount" type="tel">
      <button onclick="calculerMontant()">x</button>
      <p id ="pAmount"></p>


    </main>

<script>
  function convertirBin() {
    let texte = document.getElementById("saisieBin").value;
    let resultat = document.getElementById("outputBin");

    resultat.textContent = ""; // reset du <p>

    for (let i = 0; i < texte.length; i++) {
      resultat.textContent += texte[i].charCodeAt(0).toString(2) + " ";
    }
  }


  function calculerMontant() {
    let amount = document.getElementById("amount").value;
    let p = document.getElementById("pAmount");
    let especes = [0.01, 0.02, 0.05, 0.10, 0.20, 0.50, 1, 2, 5, 10, 20, 50, 100];
    let cumul = [];
    p.innerText = "";


    for (let i = especes.length - 1; i >= 0; i--) {
      for (;especes[i] <= amount;) {
        amount -= especes[i];
        cumul.push(especes[i]);
      }
    }
    
    p.innerText = cumul;

  }
</script>


    <footer>
      <small>
        &copy;
        <span id="year"></span>
        Mon site
      </small>
    </footer>

    <script>
      // Petit bonus: année automatique
      document.getElementById("year").textContent = new Date().getFullYear();

      // Convertion en base 64

      const base64Input = document.getElementById("base64Input");

      function base64Convert() {
        const value = base64Input.value;
        const encodedValue = window.btoa(value);
        base64Input.value = encodedValue;
      }
    </script>
  </body>
</html>
